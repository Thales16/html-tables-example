<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Schedule table</title>
</head>

<body>
    <h2 id="tableheading">Semester II Schedule</h2>
    <div class="table-wrap">
        <table>
            <caption>Fig: Semester 2 Course Schedule</caption>
            <thead>
                <tr>
                    <th scope="col">Course</th>
                    <th scope="col" colspan="2">Time</th>
                    <th scope="col">Room</th>
                    <th scope="col">Day</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row" rowspan="2">English II</th>
                    <td>9:00</td>
                    <td>11:00</td>
                    <td>L2201</td>
                    <td>Monday</td>
                </tr>
                <tr>
                    <td>9:00</td>
                    <td>11:00</td>
                    <td>L2201</td>
                    <td>Wednesday</td>
                </tr>
                <tr>
                    <th scope="row">Geography</th>
                    <td>11:00</td>
                    <td>12:45</td>
                    <td>G107</td>
                    <td>Tuesday</td>
                </tr>
                <tr>
                    <th scope="row">Biology</th>
                    <td>9:00</td>
                    <td>11:00</td>
                    <td>B302</td>
                    <td>Friday</td>
                </tr>
                <tr>
                    <th scope="row">Arts</th>
                    <td>9:00</td>
                    <td>11:00</td>
                    <td>B302</td>
                    <td>Sunday</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
