<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Comparison</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Helvetica;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f0f0f0;
            text-align: center;
        }

        .table-wrap {
            margin: 20px auto;
            padding: 10px;
            border: 1px solid black;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: white;
            display: inline-block;
        }

        h2 {
            text-align: center;
            padding: 30px 20px;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        caption {
            font-weight: bold;
            font-size: 1.5em;
            padding: 10px;
            text-align: center;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: left;
        }

        thead th {
            background-color: #007bff;
            color: white;
            font-weight: normal;
            text-align: center;
        }

        thead tr th:first-child {
            background-color: white;
            border: none;
            text-align: left;
        }

        tbody th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
    <h2 id="tableheading">Product Comparison Chart</h2>
    <div class="table-wrap">
        <table aria-labelledby="tableheading" aria-label="Product Comparison Chart">
            <caption>Product Comparison Chart</caption>
            <thead>
                <tr>
                    <th></th>
                    <th scope="col">Product A</th>
                    <th scope="col">Product B</th>
                    <th scope="col">Product C</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">Durability</th>
                    <td>10/10</td>
                    <td>5/10</td>
                    <td>7/10</td>
                </tr>
                <tr>
                    <th scope="row">Design</th>
                    <td>3/10</td>
                    <td>8/10</td>
                    <td>7/10</td>
                </tr>
                <tr>
                    <th scope="row">Usability</th>
                    <td>7/10</td>
                    <td>10/10</td>
                    <td>5/10</td>
                </tr>
                <tr>
                    <th scope="row">Price</th>
                    <td>9/10</td>
                    <td>7/10</td>
                    <td>3/10</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
